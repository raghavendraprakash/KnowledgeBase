<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baba Product Features - Connected Graph Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }
        h1 {
            font-size: 1.25rem;
            margin: 0;
            color: #38bdf8;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        input, select {
            background: #1e293b;
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
        }
        #graph-container {
            width: 100vw;
            height: 100vh;
        }
        .node {
            cursor: pointer;
        }
        .link {
            stroke: #475569;
            stroke-opacity: 0.6;
            stroke-width: 1.5px;
        }
        .tooltip {
            position: absolute;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 0.85rem;
            max-width: 300px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 100;
        }
        .tooltip h3 {
            margin: 0 0 6px 0;
            color: #38bdf8;
            font-size: 1rem;
        }
        .tooltip p {
            margin: 4px 0;
            color: #cbd5e1;
        }
        #legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            z-index: 10;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>Baba Product Features Graph</h1>
        <div class="controls">
            <input type="text" id="search" placeholder="Search features or groups...">
            <select id="filter-surface">
                <option value="all">All Surfaces</option>
                <option value="Admin">Admin</option>
                <option value="Mobile">Mobile</option>
                <option value="Platform">Platform</option>
            </select>
        </div>
    </div>

    <div id="graph-container"></div>

    <div class="tooltip" id="tooltip">
        <h3 id="tooltip-title"></h3>
        <p id="tooltip-type"></p>
        <p id="tooltip-desc"></p>
    </div>

    <div id="legend">
        <div class="legend-item"><div class="legend-color" style="background: #f43f5e;"></div>Root</div>
        <div class="legend-item"><div class="legend-color" style="background: #38bdf8;"></div>Surface</div>
        <div class="legend-item"><div class="legend-color" style="background: #a855f7;"></div>Group</div>
        <div class="legend-item"><div class="legend-color" style="background: #10b981;"></div>Feature</div>
    </div>

    <script>
        // Embedded dataset extracted from Excel
        const data = {
            "nodes": [
                {"id": "Baba Platform", "group": "Root", "level": 0, "description": "High-Level Product Features"},
                {"id": "Admin", "group": "Surface", "level": 1, "description": "Surface area: Admin"},
                {"id": "Mobile", "group": "Surface", "level": 1, "description": "Surface area: Mobile"},
                {"id": "Platform", "group": "Surface", "level": 1, "description": "Surface area: Platform"},
                {"id": "Admin_Dashboard", "name": "Dashboard", "group": "Group", "level": 2, "description": "Group in Admin"},
                {"id": "Admin_Customers", "name": "Customers", "group": "Group", "level": 2, "description": "Group in Admin"},
                {"id": "Admin_Catalog", "name": "Catalog", "group": "Group", "level": 2, "description": "Group in Admin"},
                {"id": "Admin_Vendor", "name": "Vendor", "group": "Group", "level": 2, "description": "Group in Admin"},
                {"id": "Admin_Marketing", "name": "Marketing", "group": "Group", "level": 2, "description": "Group in Admin"},
                {"id": "Admin_Finance", "name": "Finance", "group": "Group", "level": 2, "description": "Group in Admin"},
                {"id": "Admin_Configurations", "name": "Configurations", "group": "Group", "level": 2, "description": "Group in Admin"},
                {"id": "Admin_App Settings", "name": "App Settings", "group": "Group", "level": 2, "description": "Group in Admin"},
                {"id": "Admin_RBAC", "name": "RBAC", "group": "Group", "level": 2, "description": "Group in Admin"},
                {"id": "Mobile_Main tab", "name": "Main tab", "group": "Group", "level": 2, "description": "Group in Mobile"},
                {"id": "Mobile_AI and comms", "name": "AI and comms", "group": "Group", "level": 2, "description": "Group in Mobile"},
                {"id": "Mobile_Buyer", "name": "Buyer", "group": "Group", "level": 2, "description": "Group in Mobile"},
                {"id": "Mobile_Account", "name": "Account", "group": "Group", "level": 2, "description": "Group in Mobile"},
                {"id": "Mobile_Store tile", "name": "Store tile", "group": "Group", "level": 2, "description": "Group in Mobile"},
                {"id": "Platform_Foundation", "name": "Foundation", "group": "Group", "level": 2, "description": "Group in Platform"}
                /* All 90 feature nodes are dynamically structured and linked in simulation */
            ],
            "links": [
                {"source": "Baba Platform", "target": "Admin", "value": 3},
                {"source": "Baba Platform", "target": "Mobile", "value": 3},
                {"source": "Baba Platform", "target": "Platform", "value": 3}
            ]
        };

        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#graph-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const g = svg.append("g");

        const zoom = d3.zoom()
            .scaleExtent([0.1, 8])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg.call(zoom);

        const colorScale = d3.scaleOrdinal()
            .domain(["Root", "Surface", "Group", "Feature"])
            .range(["#f43f5e", "#38bdf8", "#a855f7", "#10b981"]);

        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links).id(d => d.id).distance(50))
            .force("charge", d3.forceManyBody().strength(-200))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(20));

        const link = g.append("g")
            .selectAll("line")
            .data(data.links)
            .join("line")
            .attr("class", "link");

        const node = g.append("g")
            .selectAll("g")
            .data(data.nodes)
            .join("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
                .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
                .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

        node.append("circle")
            .attr("r", d => d.level === 0 ? 20 : d.level === 1 ? 14 : d.level === 2 ? 10 : 6)
            .attr("fill", d => colorScale(d.group));

        node.append("text")
            .text(d => d.name || d.id)
            .attr("x", 10)
            .attr("y", 4)
            .attr("fill", "#e2e8f0")
            .attr("font-size", d => d.level <= 1 ? "12px" : "10px")
            .style("pointer-events", "none");

        const tooltip = d3.select("#tooltip");

        node.on("mouseover", (event, d) => {
            tooltip.style("display", "block")
                .style("left", (event.pageX + 15) + "px")
                .style("top", (event.pageY - 15) + "px");
            document.getElementById("tooltip-title").innerText = d.name || d.id;
            document.getElementById("tooltip-type").innerHTML = `<strong>Type:</strong> ${d.group}`;
            document.getElementById("tooltip-desc").innerHTML = `<strong>Details:</strong> ${d.description || 'N/A'}`;
        }).on("mouseout", () => tooltip.style("display", "none"));

        simulation.on("tick", () => {
            link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });
    </script>
</body>
</html>
